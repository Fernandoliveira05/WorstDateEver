<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personagem arredondado</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #D9EEF0" renderer="colorManagement: true; physicallyCorrectLights: true">
      <a-entity position="0 -0.62 5.15">
        <a-camera look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
      </a-entity>
      <a-light type="hemisphere" color="#FFF7E7" groundColor="#83A9AE" intensity="2.2"></a-light>
      <a-light type="directional" color="#FFFFFF" intensity="2.1" position="-3 5 4"></a-light>
      <a-light type="directional" color="#B6E0E8" intensity="0.8" position="4 2 -3"></a-light>

      <!-- Modelo original: formas grandes e macias, com pouca ornamentação. -->
      <a-entity id="personagem-menzinho" position="0 -1.43 0">
        <!-- sapatos e pernas -->
        <a-sphere position="-0.4 0.37 0.15" radius="0.38" scale="1.08 0.62 1.28" color="#4B3638" material="roughness: 0.72"></a-sphere>
        <a-sphere position="0.4 0.37 0.15" radius="0.38" scale="1.08 0.62 1.28" color="#4B3638" material="roughness: 0.72"></a-sphere>
        <a-cylinder position="-0.4 0.94 0" radius="0.2" height="0.83" color="#DCE7E6" segments-radial="12"></a-cylinder>
        <a-cylinder position="0.4 0.94 0" radius="0.2" height="0.83" color="#DCE7E6" segments-radial="12"></a-cylinder>

        <!-- calça e camisa: duas massas volumosas, sem acessórios pequenos -->
        <a-sphere position="0 1.58 0" radius="0.67" scale="1.06 0.7 0.78" color="#24375E" material="roughness: 0.78"></a-sphere>
        <a-sphere position="0 2.33 0" radius="0.79" scale="1 1.03 0.83" color="#94C9E8" material="roughness: 0.74"></a-sphere>
        <a-cylinder position="0 2.67 0.63" radius="0.065" height="0.38" rotation="0 0 90" color="#6AA6CE"></a-cylinder>

        <!-- braços arredondados -->
        <a-sphere position="-0.82 2.26 0" radius="0.34" scale="0.7 1.3 0.82" rotation="0 0 -18" color="#8CC1E1"></a-sphere>
        <a-sphere position="0.82 2.26 0" radius="0.34" scale="0.7 1.3 0.82" rotation="0 0 18" color="#8CC1E1"></a-sphere>
        <a-sphere position="-0.83 1.7 0.14" radius="0.22" scale="0.95 1 0.86" color="#E9AD82"></a-sphere>
        <a-sphere position="0.83 1.7 0.14" radius="0.22" scale="0.95 1 0.86" color="#E9AD82"></a-sphere>

        <!-- suéter leve sobre os ombros -->
        <a-cylinder position="-0.53 2.95 -0.08" radius="0.105" height="1.06" rotation="0 0 42" color="#6B94C9" material="roughness: 0.86"></a-cylinder>
        <a-cylinder position="0.53 2.95 -0.08" radius="0.105" height="1.06" rotation="0 0 -42" color="#6B94C9" material="roughness: 0.86"></a-cylinder>
        <a-sphere position="0 2.77 0.68" radius="0.17" scale="1 0.85 0.5" color="#6B94C9"></a-sphere>

        <!-- cabeça redonda e ligeiramente profunda -->
        <a-sphere position="0 3.77 0" radius="1.03" scale="1.05 1 0.96" color="#EDB184" material="roughness: 0.8"></a-sphere>
        <a-sphere position="-1.03 3.75 0" radius="0.14" scale="0.72 1 0.72" color="#E5A77E"></a-sphere>
        <a-sphere position="1.03 3.75 0" radius="0.14" scale="0.72 1 0.72" color="#E5A77E"></a-sphere>

        <!-- topete loiro, polido e puxado para trás -->
        <a-sphere position="-0.16 4.55 0.06" radius="0.72" scale="1.08 0.38 0.88" rotation="0 0 -9" color="#D8B46A" material="roughness: 0.7"></a-sphere>
        <a-sphere position="0.18 4.74 0.21" radius="0.51" scale="0.93 0.72 0.58" rotation="0 0 -27" color="#E5C474"></a-sphere>
        <a-sphere position="0.49 4.35 0.72" radius="0.36" scale="1.38 0.26 0.28" rotation="0 0 -18" color="#D8B46A"></a-sphere>

        <!-- olhos, óculos e sorriso simples -->
        <a-sphere position="-0.35 3.78 0.96" radius="0.2" scale="1.18 0.79 0.22" color="#FCF8E8"></a-sphere>
        <a-sphere position="0.35 3.78 0.96" radius="0.2" scale="1.18 0.79 0.22" color="#FCF8E8"></a-sphere>
        <a-sphere position="-0.31 3.77 1.08" radius="0.095" scale="0.82 1.16 0.28" color="#25324E"></a-sphere>
        <a-sphere position="0.31 3.77 1.08" radius="0.095" scale="0.82 1.16 0.28" color="#25324E"></a-sphere>
        <a-torus position="-0.35 3.78 1.1" radius="0.285" radius-tubular="0.027" color="#6D6A63"></a-torus>
        <a-torus position="0.35 3.78 1.1" radius="0.285" radius-tubular="0.027" color="#6D6A63"></a-torus>
        <a-box position="0 3.78 1.1" width="0.16" height="0.035" depth="0.035" color="#6D6A63"></a-box>
        <a-cylinder position="-0.37 4.09 0.9" radius="0.045" height="0.34" rotation="0 0 82" color="#6B473C"></a-cylinder>
        <a-cylinder position="0.37 4.09 0.9" radius="0.045" height="0.34" rotation="0 0 -82" color="#6B473C"></a-cylinder>
        <a-sphere position="0 3.37 0.98" radius="0.15" scale="1.28 0.23 0.21" color="#7B4140"></a-sphere>
      </a-entity>
    </a-scene>
  </body>
</html>
